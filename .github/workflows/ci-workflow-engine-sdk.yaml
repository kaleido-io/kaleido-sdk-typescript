name: Kaleido SDK CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'samples/**'
      - '.github/workflows/ci-workflow-engine-sdk.yaml'
      - '.github/workflows/ci-docker-samples.yaml'
      - '.github/workflows/ci-ksdk-init.yaml'

permissions:
  contents: read

jobs:
  packages:
    name: Lint, Build & Test (packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install workspace dependencies
        run: npm install

      - name: Lint packages
        run: npm run lint:packages

      - name: Build packages (dependency order)
        run: npm run build:packages

      - name: Test packages
        run: npm run test:packages

  samples:
    name: Build & Test (samples)
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install workspace dependencies
        run: npm install

      - name: Build packages (required by samples)
        run: npm run build:packages

      - name: Build samples
        run: npm run build:samples

      - name: Test samples
        run: npm run test:samples

  docker:
    name: Docker Builds (Samples)
    needs: packages
    uses: ./.github/workflows/ci-docker-samples.yaml

  ksdk-init:
    name: ksdk init (templates)
    needs: packages
    uses: ./.github/workflows/ci-ksdk-init.yaml
