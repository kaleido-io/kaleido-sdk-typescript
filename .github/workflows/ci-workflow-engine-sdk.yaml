name: Kaleido Workflow Engine TypeScript SDK CI

on:
  pull_request:
    paths:
      - 'packages/workflow-engine-sdk/**'
      - 'packages/core/**'
      - '.github/workflows/ci-workflow-engine-sdk.yaml'

permissions:
  contents: read

jobs:
  sdk:
    name: Lint, Build & Test (SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/workflow-engine-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install workspace dependencies
        working-directory: .
        run: npm install

      - name: Build core
        working-directory: packages/core
        run: npm run build

      - run: npm run lint

      - run: npm run build

      - run: npm test

  template-erc20-indexer:
    name: Build & Test (erc20-indexer template)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/workflow-engine-sdk/templates/erc20-indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install workspace dependencies
        working-directory: .
        run: npm install

      - name: Build core and SDK
        working-directory: packages/core
        run: npm run build

      - name: Build SDK
        working-directory: packages/workflow-engine-sdk
        run: npm run build

      - run: npm install

      - run: npm run build

  template-getting-started:
    name: Build & Test (getting-started template)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/workflow-engine-sdk/templates/getting-started
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install workspace dependencies
        working-directory: .
        run: npm install

      - name: Build core
        working-directory: packages/core
        run: npm run build

      - name: Build SDK
        working-directory: packages/workflow-engine-sdk
        run: npm run build

      - run: npm install

      - run: npm run build

      - run: npm test
