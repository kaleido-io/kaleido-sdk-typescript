name: Kaleido Workflow Engine TypeScript SDK CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'samples/**'
      - '.github/workflows/ci-workflow-engine-sdk.yaml'

permissions:
  contents: read

jobs:
  packages:
    name: Lint, Build & Test (packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install workspace dependencies
        run: npm install

      - run: npm run lint -w packages/workflow-engine-sdk

      - name: Build packages (dependency order)
        run: npm run build:packages

      - run: npm test -w packages/asset-manager -w packages/workflow-engine-sdk

  samples:
    name: Build & Test (samples)
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install workspace dependencies
        run: npm install

      - name: Build packages (required by samples)
        run: npm run build:packages

      - name: Build samples
        run: npm run build:samples

      - name: Test samples
        run: npm test -w samples/getting-started -w samples/erc20-indexer -w samples/btc-indexer --if-present
