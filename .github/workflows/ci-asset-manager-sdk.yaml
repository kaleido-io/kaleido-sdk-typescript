name: Kaleido Asset Manager TypeScript SDK CI

on:
  pull_request:
    paths:
      - 'packages/asset-manager-sdk/**'
      - 'packages/core/**'
      - '.github/workflows/ci-asset-manager-sdk.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build (Core + Asset Manager SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm install
        working-directory: packages/core

      - run: npm run build
        working-directory: packages/core

      - run: npm install
        working-directory: packages/asset-manager-sdk

      - run: npm run build
        working-directory: packages/asset-manager-sdk
