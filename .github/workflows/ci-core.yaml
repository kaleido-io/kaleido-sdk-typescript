name: Core CI

on:
  pull_request:
    paths:
      - 'internal/core/**'
      - '.github/workflows/ci-core.yaml'

permissions:
  contents: read

jobs:
  core:
    name: Build (Core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: npm install

      - run: npm run build
