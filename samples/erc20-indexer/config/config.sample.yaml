# Configuration for the ERC-20 Indexer (KALEIDO_CONFIG_FILE).
# When running as a Hosted provider, this file is managed by the Kaleido platform.
# Copy this file to config/config.yaml and fill in your values.
# Set KALEIDO_CONFIG_FILE env var to point to your config (default: ./config/config.yaml).

workflow-engine:
  providerName: erc20-indexer
  providerMetadata:
    displayName: ERC-20 Indexer
    description: Indexes ERC-20 Transfer events into the Kaleido Asset Manager
  url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:workflow-engine/rest
  auth:
    type: basic
    username: myuser
    password: my-api-key

service-bindings:
  asset-manager:
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:my-asset-manager/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key
  evm-connector:
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:my-evm-connector/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key
