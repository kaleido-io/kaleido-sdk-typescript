# Provider configuration for the ERC-20 Indexer.
# Copy this file to config/config.yaml and fill in your values.
# Set KALEIDO_CONFIG_FILE env var to point to your config (default: ./config/config.yaml).

workflow-engine:
  providerName: erc20-indexer
  providerMetadata:
    displayName: ERC-20 Indexer
    description: Indexes ERC-20 Transfer events into the Kaleido Asset Manager
  url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:workflow-engine/rest
  auth:
    type: basic
    username: myuser
    password: my-api-key

service-bindings:
  asset-manager:
    type: asset-manager
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:my-asset-manager/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key
  evm-connector:
    type: evm-connector
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:my-evm-connector/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key

# ERC-20 contract to index
config:
  contractAddress: '0x0000000000000000000000000000000000000000'
  contractName: MyToken
  contractSymbol: TKN
  chain: ethereum   # Informational label attached to indexed transfers (e.g. "ethereum", "polygon", "base", "besu")

  # EVM stream configuration. Used in the setup hook to upsert the WFE stream.
  # stream.connectorBindingName must match the service-binding name above for the connector.
  stream:
    connectorBindingName: evm-connector
    factory: evmTransactions
    name: erc20-indexer
    description: ERC-20 Transfer events
    eventSourceConfig:
      abi: [] # paste ABI here or use the post-stream utility to create the stream with abi.json
      fromBlock: '0'
      batchSize: 50
      batchTimeout: 5s
      requiredConfirmations: 1
