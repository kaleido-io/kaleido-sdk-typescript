# Developer-managed provider configuration for the Canton CIP-56 Indexer (CONFIG_FILE).
# This file contains provider-specific settings such as stream definitions
# that are typically managed by the application developer.
# Copy this file to config/provider-config.yaml and fill in your values.
# Set CONFIG_FILE env var to point to your config (default: ./config/provider-config.yaml).

# Canton-specific stream configuration. Used in the setup hook to upsert the WFE stream.
# stream.connectorBindingName must match the service-binding name in config.yaml for the connector.
stream:
  connectorBindingName: canton-connector
  factory: cantonContractEvents
  name: canton-cip56-indexer
  description: Canton CIP-56 token holding and transfer events
  eventSourceConfig:
    fromOffset: 0
    includeCreatedEventBlob: false
    filters:
      parties: []
      interfaceIds:
        - '#splice-api-token-holding-v1:Splice.Api.Token.HoldingV1:Holding'
        - '#splice-api-token-transfer-instruction-v1:Splice.Api.Token.TransferInstructionV1:TransferInstruction'
    stream:
      pollTimeout: 5s
      batchSize: 100
