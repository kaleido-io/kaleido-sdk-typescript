# Provider configuration for the Canton CIP-56 Indexer.
# Copy this file to config/config.yaml and fill in your values.
# Set KALEIDO_CONFIG_FILE env var to point to your config (default: ./config/config.yaml).

workflow-engine:
  providerName: canton-cip56-indexer
  providerMetadata:
    displayName: Canton CIP-56 Indexer
    description: Indexes Canton CIP-56 token holding and transfer events into the Kaleido Asset Manager
  url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-canton-env/s:workflow-engine/rest
  auth:
    type: basic
    username: myuser
    password: my-api-key

service-bindings:
  asset-manager:
    type: asset-manager
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-canton-env/s:my-asset-manager/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key
  canton-connector:
    type: canton-connector
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-canton-env/s:my-canton-connector/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key

# Canton-specific stream configuration. Used in the setup hook to upsert the WFE stream.
# stream.connectorBindingName must match the service-binding name above for the connector.
config:
  stream:
    connectorBindingName: canton-connector
    factory: cantonContractEvents
    name: canton-cip56-indexer
    description: Canton CIP-56 token holding and transfer events
    eventSourceConfig:
      fromOffset: 0
      batchSize: 100
      pollTimeout: 5s
      parties: []
      interfaceIds:
        - '#splice-api-token-holding-v1:Splice.Api.Token.HoldingV1:Holding'
        - '#splice-api-token-transfer-instruction-v1:Splice.Api.Token.TransferInstructionV1:TransferInstruction'
      includeCreatedEventBlob: false
