# Operator-managed configuration for the Native ETH Indexer.
# This file is the KALEIDO_CONFIG_FILE — it contains Kaleido platform connectivity
# (workflow engine URL/auth and service bindings) and is typically provided or managed
# by the Kaleido operator.
# Copy this file to config/config.yaml and fill in your values.
# Set KALEIDO_CONFIG_FILE env var to point to your config (default: ./config/config.yaml).

workflow-engine:
  providerName: native-eth-indexer
  providerMetadata:
    displayName: Native ETH Indexer
    description: Indexes native ETH transfers into the Kaleido Asset Manager
  url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:workflow-engine/rest
  auth:
    type: basic
    username: myuser
    password: my-api-key

service-bindings:
  asset-manager:
    type: asset-manager
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:my-asset-manager/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key
  evm-connector:
    type: evm-connector
    bindingType: non-hosted
    url: https://myaccount.myinstance.kaleido.io/endpoint/e:my-evm-env/s:my-evm-connector/rest
    auth:
      type: basic
      username: myuser
      password: my-api-key
