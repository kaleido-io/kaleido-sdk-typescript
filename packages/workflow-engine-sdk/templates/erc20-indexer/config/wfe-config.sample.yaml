# Workflow Engine connection config.
# Copy this file to wfe-config.yaml and fill in your values.
# wfe-config.yaml is gitignored — never commit real credentials.
#
# Set WFE_CONFIG_FILE env var to point to this file (default: ./config/wfe-config.yaml).
# providerName must match the `name` exported from src/provider.ts.
workflow-engine:
  providerName: {{PROVIDER_NAME}}
  providerMetadata:
    displayName: ERC-20 Indexer
    description: Indexes ERC-20 Transfer events into the Kaleido Asset Manager
  url: https://<your-kaleido-account>.my-kaleido.io/endpoint/<environment>/<workflow-engine>/rest
  auth:
    type: basic
    username: <api-key-name>     # Kaleido API key username
    password: <api-key-password> # Kaleido API key password

  # Alternative: token auth
  # auth:
  #   type: token
  #   token: <your-token>
  #   header: X-Kld-Authz
  #   scheme: ""

  # retryDelay: 2s
  # maxRetries: 5   # omit for infinite retries
