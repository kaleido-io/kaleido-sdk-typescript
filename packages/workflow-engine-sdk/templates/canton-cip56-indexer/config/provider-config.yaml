# Provider configuration for the Canton CIP-56 Indexer.
# Set CONFIG_FILE env var to point to this file (default: ./config/provider-config.yaml).

# Asset Manager connection — where indexed holdings and transfers are written.
assetManager:
  account: my-account.my-kaleido.io
  environment: my-environment
  serviceName: my-assets
  auth:
    keyName: my-api-key-name
    keyValue: my-api-key

# Canton connector settings
canton:
  cantonConnector: s:my-canton-connector-service-id
