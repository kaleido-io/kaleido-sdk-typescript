          description: Human-readable label for this value
          type: string
        value:
          description: The raw value, as it appears in the field's data
          type: string
      type: object
    FieldReference:
      description: Declares that this field's value addresses a row of another collection
        - descriptive only unless some field's bindings names this field; see FieldReference
      properties:
        field:
          description: Which field on that collection to match this field's own value
            against (e.g. "urn"); empty when identifier is set
          type: string
        identifier:
          description: Match this field's value against the identifiers of a registry
            item type (registry.wallets, registry.parties, registry.assets or registry.contracts),
            resolving to the item it names
          type: boolean
        type:
          description: The collection to query to resolve this field's value (e.g.
            "registry.parties")
          type: string
      type: object
    FieldSpec:
      description: The fields that were evaluated for this result
      properties:
        bindings:
          description: Other fields on this row to resolve (via their own reference)
            and expose to this field's expression, under an alias - see FieldBinding
          items:
            $ref: '#/components/schemas/FieldBinding'
          type: array
        decorator:
          description: Named UI cell renderer hint; not interpreted by the server
          type: string
        denomination:
          description: Indicates that this field is a quantity of another type, referenced
            by the sibling field named here
          type: string
        displayName:
          description: Human-readable column label; defaults to id
          type: string
        entityKey:
          description: Dot-path read off the queried row for this column; defaults
            to id. Ignored when expression is set
          type: string
        enum:
          description: Known values for this field, each with a display label, for
            a client building a filter picker
          items:
            $ref: '#/components/schemas/FieldEnumOption'
          type: array
        expression:
          $ref: '#/components/schemas/JSONataExpression'
        filterable:
          description: Whether this field may be used in a query filter against the
            collection
          type: boolean
        hidden:
          description: When true, a client should not display this column; the engine
            still evaluates it so another field's expression can read it
          type: boolean
        id:
          description: 'Column id: the key a row''s reshaped value is exposed under'
          type: string
        reference:
          $ref: '#/components/schemas/FieldReference'
        size:
          description: 'How much data this field''s value tends to hold: small, medium
            or large - a rendering hint, not a pixel width'
          enum:
          - small
          - medium
          - large
          type: string
        type:
          description: 'Declared display type: string, integer, number, decimal, boolean,
            time, date or json'
          enum:
          - string
          - integer
          - number
          - decimal
          - boolean
          - time
          - date
          - json
          type: string
        unique:
          description: Whether this field's value uniquely identifies a row of this
            view (id, urn and name commonly all qualify)
          type: boolean
      type: object
    FilterJSON:
      description: Array of sub-queries
      properties:
        and:
          items:
            $ref: '#/components/schemas/FilterJSON'
          type: array
        contains:
          description: Array of field + value combinations to apply as string-contains
