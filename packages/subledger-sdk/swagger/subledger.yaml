    AggregateInput:
      properties:
        bucket:
          description: Groups the dimension into UTC calendar windows (minute, hour,
            day, week, month, quarter or year), producing one point per window. Requires
            dimension to be a timestamp field, such as created or effectiveTime
          enum:
          - minute
          - hour
          - day
          - week
          - month
          - quarter
          - year
          type: string
        cumulative:
          description: Turn each series' points into a running total, in dimension
            order - meaningful only when dimension is naturally ordered (typically
            bucketed time)
          type: boolean
        dimension:
          description: Field to group matching results by, producing one point per
            distinct value. If omitted, a single point is computed per split.
          type: string
        func:
          description: 'Aggregation function applied to each group to calculate a
            value for its point: sum, average, count, min, max or count-distinct.
            Required.'
          enum:
          - sum
          - average
          - count
          - min
          - max
          - count-distinct
          type: string
        limit:
          description: 'Maximum number of groups to return, in order. With order "-value"
            this is a Top-N: the N largest groups are selected before any cap applies.
            Omit for every group up to the group cap'
          type: integer
        measure:
          description: Field to aggregate. Required for every function except count
          type: string
        order:
          description: 'Ordering of the returned groups: dimension (default), -dimension,
            value or -value. A leading ''-'' means descending. Ordering by value requires
            a single group-by field'
          enum:
          - dimension
          - -dimension
          - value
          - -value
          type: string
        query:
          $ref: '#/components/schemas/QueryJSON'
        splitBy:
          description: Produces a separate series per distinct value of this field.
            If omitted, the result is a single series.
          type: string
      type: object
    AggregatePoint:
      description: One point per distinct dimension value in this series
      properties:
        dimension:
          description: The group-by value for this point. A time dimension (including
            a bucket start) is an RFC3339 string, matching the same field on a row
            read; other fields are the raw group-by value
        value:
          $ref: '#/components/schemas/Decimal'
      type: object
    AggregateResult:
      properties:
        series:
          description: One series per distinct splitBy value, or a single unkeyed
            series when there is no splitBy
          items:
            $ref: '#/components/schemas/AggregateSeries'
          type: array
        truncated:
          description: Set to "rows" when the underlying row scan was capped before
            grouping (the returned values are a partial aggregate), or "groups" when
            every returned group is exact but the number of groups was capped. Absent
            when neither cap was hit.
          enum:
          - rows
          - groups
          type: string
      type: object
    AggregateSeries:
      description: One series per distinct splitBy value, or a single unkeyed series
        when there is no splitBy
      properties:
        key:
          description: The splitBy value this series groups, when the aggregation
            has a splitBy; absent otherwise
          type: string
        points:
          description: One point per distinct dimension value in this series
          items:
            $ref: '#/components/schemas/AggregatePoint'
          type: array
      type: object
    Asset:
      description: The asset this value names. Present only when the read sets includeSubject
      properties:
        created:
          $ref: '#/components/schemas/FFTime'
        decimals:
          description: 'Required scale of the asset: an amount is an integer count
            of 10^-decimals units. Use 0 for an asset with no fractional part. Immutable,
            so a re-scale is a new asset'
          type: integer
        id:
          description: Immutable integer primary key assigned by the database, providing
            stable ordering and paging cursors
          format: int64
          type: integer
        info:
          additionalProperties: true
          description: Additional descriptive information, stored verbatim and never
            interpreted by the service
          nullable: true
          type: object
        labels:
          additionalProperties:
            description: Key-value labels attached to the resource. Indexed and filterable
            type: string
          description: Key-value labels attached to the resource. Indexed and filterable
          type: object
